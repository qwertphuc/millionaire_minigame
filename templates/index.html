<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millionaire Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            /* keep the white card near the top on desktop so the page doesn't feel empty */
            align-items: flex-start;
            padding: 40px 20px;
        }
        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 980px;
            width: 100%;
            padding: 28px;
        }
        .answer-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .answer-btn.removed {
            opacity: 0.3;
            background: #ccc;
        }

        .supports {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .support-btn {
            flex: 1;
            min-width: 150px;
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .support-btn:hover:not(:disabled) {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .support-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .start-btn {
            width: 100%;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.3em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .ai-response {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
            display: none;
        }

        .ai-response.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.2em;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .explanation {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .hidden {
            display: none;
        }

        .level-ladder {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .level-ladder-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #667eea;
        }

        .level-items {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 5px;
        }

        .level-item {
            padding: 8px 12px;
            border-radius: 5px;
            background: #e9ecef;
            font-size: 0.9em;
        }

        .level-item.current {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        .level-item.completed {
            background: #28a745;
            color: white;
        }
        .answer-btn.fade-out {
            animation: fadeAnswer 0.35s forwards;
        }
        @keyframes fadeAnswer {
            to { opacity: 0.28; transform: scale(0.98); }
        }
        /* Animations and microinteractions */
        .question-container.fade-out {
            animation: fadeOut 0.25s forwards;
        }
        .question-container.fade-in {
            animation: fadeIn 0.25s forwards;
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: scale(0.98) rotateX(5deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98) rotateX(5deg); }
            to { opacity: 1; transform: scale(1) rotateX(0); }
        }

        .question-card.flip {
            transform-style: preserve-3d;
            transition: transform 0.45s ease;
        }
        .question-card.flipped {
            transform: rotateY(180deg);
        }

        .level-display.slide {
            animation: slideLevel 0.45s ease;
        }
        @keyframes slideLevel {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        /* Layout for three boards */
        .top-board { margin-bottom: 14px; }
    .game-header{display:block;position:relative;padding:6px 0 12px}
    /* title sits on the left; controls float to the top-right of the card */
    .game-title{color:#667eea;font-size:1.3rem;margin:0;font-weight:700}
    .game-controls{display:flex;gap:8px;align-items:center;position:absolute;top:12px;right:16px}
    .mute-btn{background:#6c757d;color:white;border:none;padding:8px 10px;border-radius:8px;cursor:pointer}

    /* content layout: main + side */
    /* layout: left sidebar + main content. keep content left-aligned inside the card */
    .content{display:flex;gap:24px;align-items:flex-start;justify-content:flex-start;max-width:880px;margin:0 auto}
    .main-board{flex:1;min-width:420px;padding-top:6px}
    /* broader white area behind question + answers */
    .qa-area{background:#fff;padding:16px;border-radius:10px;box-shadow:0 6px 18px rgba(11,15,30,0.04);border:1px solid rgba(0,0,0,0.04);width:100%}
    /* question and answers layout */
    .question{font-size:1.05rem;margin-bottom:8px;color:#222;padding:6px 4px}
    .answers{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px}
    /* answer button row */
    .answer-btn{display:flex;align-items:center;gap:12px;border:1px solid rgba(0,0,0,0.06);background:#fff;padding:12px 14px;border-radius:8px;cursor:pointer;text-align:left}
    .answer-btn:hover:not(:disabled){background:#f7fafc;transform:translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,0.04)}
    .answer-letter{display:inline-flex;width:30px;height:30px;border-radius:6px;background:#eef2ff;color:#3b82f6;align-items:center;justify-content:center;font-weight:700}
    .answer-text{flex:1}
    /* responsive: on narrow screens keep single column; on wider screens still show single rows but allow more spacing */
    @media(min-width:980px){
        .answers{gap:14px}
        .answer-btn{padding:14px 16px}
    }
    /* inner question card sits on the white qa-area (make transparent to avoid double card) */
    .question-container{background:transparent;padding:12px;border-radius:8px}
    .answer-btn:focus{outline:3px solid rgba(102,126,234,0.18);}        
    .side-board{width:88px;display:none;flex-direction:column;align-items:center;gap:10px;position:sticky;top:20px;height:fit-content}
    .content.with-side .side-board{display:flex}
    .vertical-level-items{display:flex;flex-direction:column;gap:8px}
    .vertical-level-items .level-item{padding:8px 12px;border-radius:8px;background:#e9ecef;width:44px;text-align:center}
    .vertical-level-items .level-item.current{background:#667eea;color:white;font-weight:700}
    /* completed state visuals and pulse animation when a level is newly completed */
    .vertical-level-items .level-item.completed{background:#28a745;color:white;transition:transform .18s ease,box-shadow .18s ease}
    .vertical-level-items .level-item.pulse{animation:pulseLevel .48s ease}
    @keyframes pulseLevel{
        0%{transform:scale(1);box-shadow:0 0 0 rgba(0,0,0,0)}
        50%{transform:scale(1.08);box-shadow:0 8px 20px rgba(40,167,69,0.18)}
        100%{transform:scale(1);box-shadow:0 0 0 rgba(0,0,0,0)}
    }
    /* reduce empty whitespace under controls */
    .supports{margin-bottom:14px}
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">Ai là Triệu Phú </h1>
            <div class="game-controls">
                <button id="muteBtn" class="mute-btn" title="Mute / Unmute">🔊</button>
                <button id="homeBtn" class="support-btn" style="min-width:84px;padding:8px 12px;background:#ffc107;color:#212529;">← Home</button>
            </div>
        </div>
        <!-- Content: main board (left) + side board (right with vertical progress) -->
        <div class="content">
            <!-- side board placed first so progress appears on the left -->
            <div class="side-board">
                <div class="level-display">Level <span id="currentLevel">1</span> of 8</div>
                <div class="vertical-level-items">
                    <!-- reverse order so the ladder shows 8 at the top down to 1 -->
                    <div class="level-item" id="level-8">8</div>
                    <div class="level-item" id="level-7">7</div>
                    <div class="level-item" id="level-6">6</div>
                    <div class="level-item" id="level-5">5</div>
                    <div class="level-item" id="level-4">4</div>
                    <div class="level-item" id="level-3">3</div>
                    <div class="level-item" id="level-2">2</div>
                    <div class="level-item" id="level-1">1</div>
                </div>
            </div>

            <div class="main-board">
                <div id="startScreen">
            <div class="message">
                <p>Chào mừng bạn đến với Ai là Triệu Phú!</p>
                <p style="margin-top: 10px; font-size: 0.9em;">Trả lời đúng 8 câu hỏi để chiến thắng!</p>
                <p style="margin-top: 10px; font-size: 0.9em;">Bạn có 3 tùy chọn hỗ trợ: 50/50, Đổi câu hỏi và Hỗ trợ AI</p>
            </div>
            <button class="start-btn" onclick="startGame()">Bắt đầu trò chơi</button>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="qa-area">
                <div class="supports">
                <button class="support-btn" id="fiftyFiftyBtn" onclick="useSupport('fifty_fifty')">
                    🎯 50/50
                </button>
                <button class="support-btn" id="changeQuestionBtn" onclick="useSupport('change_question')">
                    🔄 Đổi Câu Hỏi
                </button>
                <button class="support-btn" id="aiSupportBtn" onclick="useSupport('ai_support')">
                    🤖 AI Assistant
                </button>
            </div>

                <div class="ai-response" id="aiResponse"></div>

                <div class="question-container">
                    <div class="question" id="question"></div>
                    <div class="answers" id="answers"></div>
                </div>

                <div class="explanation" id="explanation"></div>
            </div>
        </div>

        <div id="endScreen" class="hidden">
            <div class="message" id="endMessage"></div>
            <div class="explanation" id="endExplanation"></div>
            <button class="start-btn" onclick="location.reload()">Play Again</button>
            </div>
            
        </div>

    <!-- confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
    let sessionId = generateSessionId();
        let currentQuestion = null;
        let removedAnswers = [];
    let previousLevel = 1;
    // mute state (persisted)
    let muted = (localStorage.getItem('millionaire_muted') === '1');

    // helper: emit 4 confetti bursts near the bottom (wider spread). multiplier scales particle counts.
    function emitBottomConfetti(mult=1) {
        try {
            if (typeof confetti !== 'function') return;
            const base = Math.round(150 * mult);
            const xs = [0.15, 0.35, 0.65, 0.85];
            xs.forEach((x, idx) => {
                confetti({
                    particleCount: Math.round(base * 0.6),
                    spread: 60,
                    startVelocity: 30 + idx * 6,
                    origin: { x: x, y: 1 },
                    scalar: 1.2 * mult
                });
            });
        } catch (e) { console.warn('confetti unavailable', e); }
    }

    function setMuteButtonIcon() {
        const b = document.getElementById('muteBtn');
        if (!b) return;
        b.textContent = muted ? '🔇' : '🔊';
    }

    // wire UI controls after DOM ready
    document.addEventListener('DOMContentLoaded', () => {
        setMuteButtonIcon();
        const mb = document.getElementById('muteBtn');
        if (mb) mb.addEventListener('click', () => { muted = !muted; localStorage.setItem('millionaire_muted', muted ? '1' : '0'); setMuteButtonIcon(); });
        const hb = document.getElementById('homeBtn');
        if (hb) hb.addEventListener('click', () => { location.href = '/'; });
    });

        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        async function startGame() {
            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ session_id: sessionId })
                });

                const data = await response.json();
                
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                // reveal the right-side progress sidebar
                const content = document.querySelector('.content');
                if (content) content.classList.add('with-side');
                
                displayQuestion(data);
                updateSupports(data.supports);
                updateLevelLadder(data.level);
                previousLevel = data.level;
            } catch (error) {
                console.error('Error starting game:', error);
                alert('Error starting game. Please try again.');
            }
        }
        function playTone(type) {
            if (muted) return;
            // small WebAudio-based chimes
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g);
                g.connect(ctx.destination);
                if (type === 'success') {
                    o.frequency.value = 880;
                    g.gain.value = 0.05;
                    o.start();
                    setTimeout(() => { o.stop(); ctx.close(); }, 250);
                } else if (type === 'small') {
                    o.frequency.value = 660;
                    g.gain.value = 0.03;
                    o.start();
                    setTimeout(() => { o.stop(); ctx.close(); }, 120);
                } else { // 'error'
                    o.frequency.value = 220;
                    g.gain.value = 0.08;
                    o.start();
                    setTimeout(() => { o.stop(); ctx.close(); }, 450);
                }
            } catch (e) {
                // ignore audio errors on old browsers
                console.warn('Audio not available', e);
            }
        }

        function animateQuestionChange(updateFn) {
            const card = document.querySelector('.question-container');
            // prefer fade; do flip as a visual alternative
            card.classList.remove('fade-in');
            card.classList.add('fade-out');
            setTimeout(() => {
                try { updateFn(); } catch (e) { console.error(e); }
                card.classList.remove('fade-out');
                card.classList.add('fade-in');
            }, 260);
        }

        function displayQuestion(data) {
            currentQuestion = data.question;
            removedAnswers = [];

            // animate the question change
            animateQuestionChange(() => {
                document.getElementById('currentLevel').textContent = data.level;
                const q = document.getElementById('question');
                q.textContent = data.question.question;

                const answersDiv = document.getElementById('answers');
                answersDiv.innerHTML = '';
                answersDiv.classList.add('answers');
                for (let i = 1; i <= 4; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'answer-btn';
                    btn.id = `answer-${i}`;
                    const letter = String.fromCharCode(64 + i);
                    const text = data.question['answer' + i] || '';
                    btn.innerHTML = `<span class="answer-letter">${letter}</span><span class="answer-text">${text}</span>`;
                    btn.onclick = () => submitAnswer(i);
                    btn.disabled = false;
                    answersDiv.appendChild(btn);
                }
                document.getElementById('aiResponse').classList.remove('show');
                document.getElementById('explanation').classList.remove('show');
            });
        }

        async function submitAnswer(answer) {
            // Disable all answer buttons to prevent multiple clicks
            disableAllAnswers();
            
            try {
                const response = await fetch('/api/answer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        answer: answer
                    })
                });

                const data = await response.json();
                
                if (data.status === 'correct') {
                    playTone('success');
                    showMessage('Chính xác! Chuyển sang cấp độ tiếp theo...', 'success');
                    // Keep buttons disabled during transition
                    setTimeout(() => {
                        displayQuestion(data);
                        updateSupports(data.supports);
                        // if passed milestone 4 or 8, show confetti
                        const newLevel = data.level;
                        if (previousLevel <= 4 && newLevel === 5) {
                            // passing level 4 -> emit 4 bottom confetti bursts, 20% larger
                            emitBottomConfetti(1.2);
                        }
                        updateLevelLadder(data.level);
                        previousLevel = newLevel;
                        document.getElementById('explanation').classList.remove('show');
                    }, 600);
                } else if (data.status === 'won') {
                    playTone('success');
                    // larger celebratory bottom confetti
                    emitBottomConfetti(1.2);
                    // repeat quickly for a bigger effect
                    setTimeout(()=> emitBottomConfetti(1.2), 250);
                    showEndScreen('🎉 Chúc mừng! Bạn đã chiến thắng trò chơi Ai là Triệu Phú! 🎉', 'success');
                } else if (data.status === 'game_over') {
                    playTone('error');
                    showEndScreen('❌ Game Over! Sai câu trả lời.', 'error');
                    if (data.explanation) {
                        const explDiv = document.getElementById('endExplanation');
                        explDiv.innerHTML = `<strong>Giải thích:</strong> ${data.explanation}`;
                        explDiv.classList.add('show');
                    }
                }
            } catch (error) {
                console.error('Error submitting answer:', error);
                alert('Error submitting answer. Please try again.');
                // Re-enable buttons on error
                enableAllAnswers();
            }
        }
        
        function disableAllAnswers() {
            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById(`answer-${i}`);
                if (btn) {
                    btn.disabled = true;
                }
            }
        }
        
        function enableAllAnswers() {
            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById(`answer-${i}`);
                if (btn && !removedAnswers.includes(i)) {
                    btn.disabled = false;
                }
            }
        }

        async function useSupport(supportType) {
            try {
                const response = await fetch('/api/support', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        support_type: supportType
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert(error.detail);
                    return;
                }

                const data = await response.json();
                updateSupports(data.supports);

                if (supportType === 'fifty_fifty') {
                    removedAnswers = data.removed_answers;
                    // fade-out removed answers before fully disabling
                    data.removed_answers.forEach(ans => {
                        const btn = document.getElementById(`answer-${ans}`);
                        if (!btn) return;
                        btn.classList.add('fade-out');
                        // after fade, mark as removed and keep disabled
                        setTimeout(() => {
                            btn.disabled = true;
                            btn.classList.add('removed');
                        }, 360);
                    });
                    playTone('small');
                } else if (supportType === 'change_question') {
                    // animate question change
                    playTone('small');
                    displayQuestion(data);
                } else if (supportType === 'ai_support') {
                    const aiDiv = document.getElementById('aiResponse');
                    aiDiv.innerHTML = `<strong>🤖 AI Assistant:</strong><br>${data.ai_response}`;
                    aiDiv.classList.add('show');
                    playTone('small');
                }
            } catch (error) {
                console.error('Error using support:', error);
                alert('Error using support. Please try again.');
            }
        }

        function updateSupports(supports) {
            document.getElementById('fiftyFiftyBtn').disabled = !supports.fifty_fifty;
            document.getElementById('changeQuestionBtn').disabled = !supports.change_question;
            document.getElementById('aiSupportBtn').disabled = !supports.ai_support;
        }

        function updateLevelLadder(currentLevel) {
            for (let i = 1; i <= 8; i++) {
                const levelItem = document.getElementById(`level-${i}`);
                if (!levelItem) continue;
                // remember previous completed state so we can animate newly completed levels
                const wasCompleted = levelItem.classList.contains('completed');
                levelItem.classList.remove('current', 'completed');
                if (i < currentLevel) {
                    levelItem.classList.add('completed');
                    // animate only when it transitions from not-completed to completed
                    if (!wasCompleted) {
                        levelItem.classList.add('pulse');
                        setTimeout(() => levelItem.classList.remove('pulse'), 600);
                    }
                } else if (i === currentLevel) {
                    levelItem.classList.add('current');
                }
            }
            // subtle slide animation for level change
            const ld = document.querySelector('.level-display');
            ld.classList.remove('slide');
            // force reflow
            void ld.offsetWidth;
            ld.classList.add('slide');
        }

        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            
            const container = document.querySelector('.question-container');
            container.parentNode.insertBefore(messageDiv, container);
            
            setTimeout(() => messageDiv.remove(), 2000);
        }

        function showEndScreen(message, type) {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');
            // ensure sidebar stays visible on end screen
            const content = document.querySelector('.content');
            if (content) content.classList.add('with-side');
            
            const endMsg = document.getElementById('endMessage');
            endMsg.className = `message ${type}`;
            endMsg.textContent = message;
        }
    </script>
</body>
</html>
